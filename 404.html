<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — VDOSTAL</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800;900&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:8px;}
  .nf .code{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-text);}
  .nf h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:.86;font-size:clamp(64px,16vw,180px);margin:6px 0 10px;}
  .nf h1 .blue{color:var(--blue-text);}
  .nf p{color:#9A9AA0;max-width:40ch;margin:0 0 28px;}
</style>
</head>
<body>
  <main class="nf">
    <span class="code">Error 404</span>
    <h1>Page<br><span class="blue">not found.</span></h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/" class="btn btn-primary">Back to home <span class="arw">↗</span></a>
  </main>
</body>
</html>
